    <text x="56" y="148" font-size="16" letter-spacing="1" class="sec">AGE</text>
    <line x1="212" y1="143" x2="330" y2="143" class="lead"/>
    <text x="344" y="148" font-size="16" letter-spacing="1" class="pri">19</text>
    <text x="56" y="188" font-size="16" letter-spacing="1" class="sec">STATUS</text>
    <line x1="212" y1="183" x2="330" y2="183" class="lead"/>
    <text x="344" y="188" font-size="16" letter-spacing="1" class="pri">ONLINE</text>
    <rect x="412" y="174" width="9" height="17" class="cursor"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.6;.75;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <text x="56" y="228" font-size="16" letter-spacing="1" class="sec">MODE</text>
    <line x1="212" y1="223" x2="330" y2="223" class="lead"/>
    <text x="344" y="228" font-size="16" letter-spacing="1" class="pri">VIBE CODING</text>
    <text x="56" y="268" font-size="16" letter-spacing="1" class="sec">INTERESTS</text>
    <line x1="212" y1="263" x2="330" y2="263" class="lead"/>
    <text x="344" y="268" font-size="16" letter-spacing="1" class="pri">GAMES / CODE / AI</text>
        <g>
      <text x="344" y="308" font-size="16" letter-spacing="1" class="pri">BUILDING</text>
      <animate attributeName="opacity" values="1;1;.35;1" keyTimes="0;.85;.93;1" dur="3s" repeatCount="indefinite"/>
    </g>
  <text x="56" y="382" font-size="16" class="sec">$</text>
  <rect x="76" y="370" width="10" height="16" class="cursor">
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.5;.6;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="744" y="404" text-anchor="end" font-size="11" letter-spacing="2" class="dim">[ AUTHORIZED PERSONNEL ONLY ]</text>
</svg>