<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <style>    .pri{fill:#FFFFFF}
    .sec{fill:#808080}
    .dim{fill:#808080;opacity:.4}
    .panel{fill:#FFFFFF;opacity:.03}
    .frame{fill:none;stroke:#808080;stroke-width:1.5}
    .hair{stroke:#202020;stroke-width:1}
    .lead{stroke:#202020;stroke-width:1.5;stroke-dasharray:2 7}
    .flow{fill:none;stroke:#808080;stroke-width:1.5;stroke-dasharray:4 6}
    .box{fill:#000000;fill-opacity:.35;stroke:#808080;stroke-width:1.5}
    .inv{fill:#FFFFFF}
    .invT{fill:#000000}
    .cursor{fill:#FFFFFF}
    text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace;}
  </style>

  <rect x="20" y="20" width="740" height="400" rx="10" class="panel"/>
  <rect x="20" y="20" width="740" height="400" rx="10" class="frame"/>
  <line x1="21" y1="66" x2="759" y2="66" class="hair"/>

  <circle cx="48" cy="43" r="6" class="dim"/>
  <circle cx="72" cy="43" r="6" class="dim"/>
  <circle cx="96" cy="43" r="6" class="sec"/>

  <text x="122" y="48" font-size="14" class="sec">philly@mainframe:~$ cat whoami.txt</text>

    <text x="56" y="108" font-size="16" letter-spacing="1" class="sec">USER</text>
    <line x1="212" y1="103" x2="330" y2="103" class="lead"/>
