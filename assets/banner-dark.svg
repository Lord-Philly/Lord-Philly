<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <style>
    .pri{fill:#FFFFFF}
    .sec{fill:#808080}
    .dim{fill:#808080;opacity:.4}
    .panel{fill:#FFFFFF;opacity:.03}
    .frame{fill:none;stroke:#808080;stroke-width:1.5}
    .box{fill:#000000;fill-opacity:.35;stroke:#808080;stroke-width:1.5}
    .inv{fill:#FFFFFF}
    .invT{fill:#000000}
    .cursor{fill:#FFFFFF}
    .scanline{fill:none;stroke:#808080;stroke-width:0.5;opacity:0.3}
    .dataflow{fill:none;stroke:#808080;stroke-width:1;stroke-dasharray:2 4}
    text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace;}
  </style>

  <!-- Background grid -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="920" y2="50" class="scanline"/>
    <line x1="0" y1="100" x2="920" y2="100" class="scanline"/>
    <line x1="0" y1="150" x2="920" y2="150" class="scanline"/>
    <line x1="0" y1="200" x2="920" y2="200" class="scanline"/>
    <line x1="0" y1="250" x2="920" y2="250" class="scanline"/>
    <line x1="0" y1="300" x2="920" y2="300" class="scanline"/>
    <line x1="0" y1="350" x2="920" y2="350" class="scanline"/>
  </g>

  <!-- Scanning line animation -->
  <g>
    <line x1="0" y1="0" x2="920" y2="0" stroke="#808080" stroke-width="2" opacity="0.5">
      <animate attributeName="y1" values="0;400;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;400;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Frame corners -->
  <g>
    <polyline points="30,58 30,26 62,26" class="frame"/>
    <polyline points="858,222 890,222 890,254" class="frame"/>
    <polyline points="890,58 890,26 858,26" class="frame"/>
    <polyline points="30,222 30,254 62,254" class="frame"/>
  </g>

  <!-- Header text -->
  <text x="46" y="46" font-size="13" letter-spacing="2" class="sec">// DEDSEC_NODE :: ACTIVE</text>

  <!-- REC indicator with blink -->
  <g>
    <circle cx="836" cy="41" r="5" class="cursor">
      <animate attributeName="opacity" values="1;1;.1;1;1" keyTimes="0;.72;.78;.86;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="850" y="46" font-size="13" letter-spacing="3" class="sec">REC</text>
  </g>

  <!-- DEDSEC text with glitch -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 0; -4 0; 3 0; 0 0; 0 0" keyTimes="0;.82;.86;.9;.94;1"
      dur="6s" repeatCount="indefinite"/>
    <text x="460" y="130" text-anchor="middle" font-size="72" font-weight="bold" letter-spacing="15" class="sec" opacity=".5">DEDSEC</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 0; 4 1; -3 0; 0 0; 0 0" keyTimes="0;.84;.88;.92;.96;1"
      dur="6s" repeatCount="indefinite"/>
    <text x="460" y="130" text-anchor="middle" font-size="72" font-weight="bold" letter-spacing="15" class="pri" opacity=".22">DEDSEC</text>
  </g>
  <text x="460" y="130" text-anchor="middle" font-size="72" font-weight="bold" letter-spacing="15" class="pri">DEDSEC</text>

  <!-- Subtitle -->
  <text x="460" y="170" text-anchor="middle" font-size="18" letter-spacing="4" class="sec">NÓ DA REDE // BR-RO-CO</text>

  <!-- User info box -->
  <rect x="60" y="190" width="800" height="80" class="box"/>
  
  <text x="80" y="215" font-size="12" letter-spacing="2" class="sec">USUÁRIO:</text>
  <text x="80" y="235" font-size="16" letter-spacing="1" class="pri">ph1lly.w3ird</text>
  
  <text x="300" y="215" font-size="12" letter-spacing="2" class="sec">STATUS:</text>
  <text x="300" y="235" font-size="16" letter-spacing="1" class="pri">■ ONLINE</text>
  
  <text x="500" y="215" font-size="12" letter-spacing="2" class="sec">ORIGEM:</text>
  <text x="500" y="235" font-size="16" letter-spacing="1" class="pri">RO, BR</text>
  
  <text x="700" y="215" font-size="12" letter-spacing="2" class="sec">CLEARANCE:</text>
  <text x="700" y="235" font-size="16" letter-spacing="1" class="pri">NÍVEL 01</text>

  <!-- Data flow lines -->
  <g>
    <path d="M 60 280 Q 200 290 460 280 Q 720 270 860 280" class="dataflow">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 290 Q 200 300 460 290 Q 720 280 860 290" class="dataflow">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 300 Q 200 310 460 300 Q 720 290 860 300" class="dataflow">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Status bar -->
  <rect x="60" y="320" width="800" height="1.5" class="dim"/>
  <rect y="318.5" width="110" height="4" class="cursor">
    <animate attributeName="x" values="60;750;60" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer text -->
  <text x="60" y="345" font-size="12" letter-spacing="2" class="sec">SISTEMA: OPERACIONAL</text>
  <text x="460" y="345" text-anchor="middle" font-size="12" letter-spacing="2" class="sec">ACESSO: CONCEDIDO</text>
  <text x="860" y="345" text-anchor="end" font-size="12" letter-spacing="2" class="sec">CHECKSUM :: OK</text>

  <!-- Blinking access granted -->
  <text x="460" y="380" text-anchor="middle" font-size="14" letter-spacing="3" class="pri">
    [ ACESSO CONCEDIDO ]
    <animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;.45;.5;.55;1" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
