<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <style>    .pri{fill:#FFFFFF}
    .sec{fill:#808080}
    .dim{fill:#808080;opacity:.4}
    .panel{fill:#FFFFFF;opacity:.03}
    .frame{fill:none;stroke:#808080;stroke-width:1.5}
    .hair{stroke:#202020;stroke-width:1}
    .lead{stroke:#202020;stroke-width:1.5;stroke-dasharray:2 7}
    .flow{fill:none;stroke:#808080;stroke-width:1.5;stroke-dasharray:4 6}
    .box{fill:#000000;fill-opacity:.35;stroke:#808080;stroke-width:1.5}
    .inv{fill:#FFFFFF}
    .invT{fill:#000000}
    .cursor{fill:#FFFFFF}
    text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace;}
  </style>

  <text x="100" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">01</text>
    <rect x="41" y="74" width="118" height="64" class="box" rx="4"/>
      <text x="100" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="pri">IDEA</text>
    <line x1="164" y1="106" x2="188" y2="106" class="flow">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <polygon points="188,101 195,106 188,111" class="sec"/>
    <text x="252" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">02</text>
    <rect x="193" y="74" width="118" height="64" class="box" rx="4"/>
      <text x="252" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="pri">AI</text>
    <line x1="316" y1="106" x2="340" y2="106" class="flow">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <polygon points="340,101 347,106 340,111" class="sec"/>
    <text x="404" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">03</text>
    <rect x="345" y="74" width="118" height="64" class="box" rx="4"/>
      <text x="404" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="pri">CODE</text>
    <line x1="468" y1="106" x2="492" y2="106" class="flow">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <polygon points="492,101 499,106 492,111" class="sec"/>
    <text x="556" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">04</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-2 0;2 0;0 0;0 0" keyTimes="0;.86;.9;.94;.97;1" dur="4.5s" repeatCount="indefinite"/>
      <rect x="497" y="74" width="118" height="64" class="inv" rx="4"/>
      <text x="556" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="invT">BREAK</text>
    </g>
    <line x1="620" y1="106" x2="644" y2="106" class="flow">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <polygon points="644,101 651,106 644,111" class="sec"/>
    <text x="708" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">05</text>
    <rect x="649" y="74" width="118" height="64" class="box" rx="4"/>
      <text x="708" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="pri">FIX</text>
    <line x1="772" y1="106" x2="796" y2="106" class="flow">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <polygon points="796,101 803,106 796,111" class="sec"/>
    <text x="860" y="62" text-anchor="middle" font-size="11" letter-spacing="3" class="dim">06</text>
    <rect x="801" y="74" width="118" height="64" class="box" rx="4"/>
      <rect x="806" y="79" width="108" height="54" fill="none" stroke="#808080" stroke-width="1" rx="2" opacity=".6"/>
      <text x="860" y="115" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="2" class="pri">SHIP</text>
  <text x="480" y="192" text-anchor="middle" font-size="15" letter-spacing="1" class="sec">$ iterate( idea &#8594; reality ) until real;</text>
  <text x="480" y="216" text-anchor="middle" font-size="12" letter-spacing="2" class="dim">// LOOP FOREVER // THE AI SITS ON MY SIDE OF THE KEYBOARD //</text>
</svg>