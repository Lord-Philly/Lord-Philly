<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <style>
    .pri{fill:#FFFFFF}
    .sec{fill:#808080}
    .dim{fill:#808080;opacity:.4}
    .box{fill:#000000;fill-opacity:.35;stroke:#808080;stroke-width:1.5}
    .active{fill:#00FF00}
    .pending{fill:#FFAA00}
    .classified{fill:#FF0000}
    text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace;}
  </style>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="14" letter-spacing="3" class="sec">// OPERAÇÕES EM ANDAMENTO</text>

  <!-- Operations box -->
  <rect x="60" y="45" width="800" height="240" class="box"/>

  <!-- Operation 1 -->
  <rect x="80" y="60" width="760" height="60" fill="#1A1A1A" stroke="#808080" stroke-width="1"/>
  <text x="100" y="80" font-size="12" letter-spacing="2" class="sec">[01] OPERAÇÃO: PROJETO_ALPHA</text>
  <text x="100" y="100" font-size="11" letter-spacing="1" class="pri">STATUS: ATIVO</text>
  <circle cx="750" cy="80" r="5" class="active">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="770" y="85" font-size="10" letter-spacing="1" class="active">ATIVO</text>

  <!-- Operation 2 -->
  <rect x="80" y="130" width="760" height="60" fill="#1A1A1A" stroke="#808080" stroke-width="1"/>
  <text x="100" y="150" font-size="12" letter-spacing="2" class="sec">[02] OPERAÇÃO: PROJETO_BETA</text>
  <text x="100" y="170" font-size="11" letter-spacing="1" class="pri">STATUS: EM DESENVOLVIMENTO</text>
  <circle cx="750" cy="150" r="5" class="pending">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="770" y="155" font-size="10" letter-spacing="1" class="pending">PENDENTE</text>

  <!-- Operation 3 -->
  <rect x="80" y="200" width="760" height="60" fill="#1A1A1A" stroke="#808080" stroke-width="1"/>
  <text x="100" y="220" font-size="12" letter-spacing="2" class="sec">[03] OPERAÇÃO: ██████████</text>
  <text x="100" y="240" font-size="11" letter-spacing="1" class="pri">STATUS: CLASSIFICADO</text>
  <circle cx="750" cy="220" r="5" class="classified">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="770" y="225" font-size="10" letter-spacing="1" class="classified">RESTRITO</text>

  <!-- Scanning line -->
  <line x1="80" y1="60" x2="840" y2="60" stroke="#808080" stroke-width="1" opacity="0.5">
    <animate attributeName="y1" values="60;260;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="60;260;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
