<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280">
  <style>    .pri{fill:#000000}
    .sec{fill:#808080}
    .dim{fill:#808080;opacity:.4}
    .panel{fill:#000000;opacity:.04}
    .frame{fill:none;stroke:#808080;stroke-width:1.5}
    .hair{stroke:#808080;stroke-width:1;opacity:.35}
    .lead{stroke:#808080;stroke-width:1.5;stroke-dasharray:2 7;opacity:.5}
    .flow{fill:none;stroke:#808080;stroke-width:1.5;stroke-dasharray:4 6}
    .box{fill:#000000;fill-opacity:.04;stroke:#808080;stroke-width:1.5}
    .inv{fill:#000000}
    .invT{fill:#FFFFFF}
    .cursor{fill:#000000}
    text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace;}
  </style>

  <g>
    <polyline points="30,58 30,26 62,26" class="frame"/>
    <polyline points="858,222 890,222 890,254" class="frame"/>
    <polyline points="890,58 890,26 858,26" class="frame"/>
    <polyline points="30,222 30,254 62,254" class="frame"/>

    <text x="46" y="46" font-size="13" letter-spacing="2" class="sec">// IDENTITY_CARD :: VERIFIED</text>

    <g>
      <circle cx="836" cy="41" r="5" class="cursor">
        <animate attributeName="opacity" values="1;1;.1;1;1" keyTimes="0;.72;.78;.86;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="850" y="46" font-size="13" letter-spacing="3" class="sec">REC</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 0; -4 0; 3 0; 0 0; 0 0" keyTimes="0;.82;.86;.9;.94;1"
        dur="6s" repeatCount="indefinite"/>
      <text x="460" y="152" text-anchor="middle" font-size="92" font-weight="bold" letter-spacing="20" class="sec" opacity=".5">PHILLY</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 0; 4 1; -3 0; 0 0; 0 0" keyTimes="0;.84;.88;.92;.96;1"
        dur="6s" repeatCount="indefinite"/>
      <text x="460" y="152" text-anchor="middle" font-size="92" font-weight="bold" letter-spacing="20" class="pri" opacity=".22">PHILLY</text>
    </g>
    <text x="463" y="149" text-anchor="middle" font-size="92" font-weight="bold" letter-spacing="20" class="pri">PHILLY</text>

    <text x="460" y="196" text-anchor="middle" font-size="19" letter-spacing="5" class="sec">19 // DEVELOPER // GAMER // VIBE CODER</text>

    <rect x="60" y="222" width="800" height="1.5" class="dim"/>
    <rect y="220.5" width="110" height="4" class="cursor">
      <animate attributeName="x" values="60;750;60" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="246" font-size="12" letter-spacing="2" class="sec">SIGNAL: ACTIVE</text>
    <text x="860" y="246" text-anchor="end" font-size="12" letter-spacing="2" class="sec">CHECKSUM :: OK</text>
  </g>
</svg>